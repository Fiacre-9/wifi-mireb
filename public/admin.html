<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin – Tickets WiFi</title>
<style>
  body { font-family:system-ui,sans-serif; margin:0; background:#f1f5f9; color:#0f172a; }
  .wrap { max-width:960px; margin:0 auto; padding:16px; }
  .box { background:#fff; border-radius:14px; padding:16px; margin-bottom:16px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  h1 { font-size:1.3rem; } h2 { font-size:1.05rem; margin-top:0; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .stat { background:#f8fafc; border-radius:10px; padding:12px; text-align:center; }
  .stat b { display:block; font-size:1.6rem; }
  .warn { background:#fef2f2; color:#b91c1c; }
  textarea, input { width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:8px; font-size:1rem; font-family:monospace; }
  textarea { min-height:140px; }
  button { padding:10px 16px; border:0; border-radius:8px; background:#16a34a; color:#fff; font-weight:600; cursor:pointer; margin-top:8px; }
  button.gray { background:#64748b; } button.red { background:#dc2626; padding:4px 10px; margin:0; }
  table { width:100%; border-collapse:collapse; font-size:.9rem; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid #e2e8f0; }
  .hide { display:none; } .msg { margin-top:8px; font-size:.9rem; }
  .scroll { max-height:340px; overflow:auto; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📶 Admin – Machine à tickets WiFi</h1>

  <div id="login" class="box">
    <h2>Connexion</h2>
    <input id="pw" type="password" placeholder="Mot de passe admin">
    <button id="loginBtn">Se connecter</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <div id="panel" class="hide">
    <div class="box"><div class="stats" id="stats"></div></div>

    <div class="box">
      <h2>Ajouter des codes (générés dans le portail captif)</h2>
      <textarea id="codes" placeholder="Un code par ligne (ou séparés par virgule / espace)"></textarea>
      <button id="addBtn">Ajouter au stock</button>
      <button class="gray" id="exportBtn">Exporter CSV</button>
      <button class="gray" id="logoutBtn">Déconnexion</button>
      <div class="msg" id="addMsg"></div>
    </div>

    <div class="box"><h2>Codes (500 derniers)</h2><div class="scroll"><table id="tCodes"></table></div></div>
    <div class="box"><h2>Commandes (200 dernières)</h2><div class="scroll"><table id="tOrders"></table></div></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const fmt = t => new Date(t).toLocaleString('fr-FR');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(url, opt) {
  const r = await fetch(url, Object.assign({ headers:{'Content-Type':'application/json'} }, opt));
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && !url.includes('login')) { $('login').classList.remove('hide'); $('panel').classList.add('hide'); }
  if (!r.ok) throw new Error(j.error || 'Erreur');
  return j;
}

async function load() {
  try {
    const s = await api('/api/admin/summary');
    $('login').classList.add('hide'); $('panel').classList.remove('hide');
    $('stats').innerHTML =
      `<div class="stat"><b>${s.unused}</b>Codes disponibles</div>
       <div class="stat"><b>${s.used}</b>Codes vendus</div>
       <div class="stat"><b>${s.pending}</b>Paiements en attente</div>
       <div class="stat"><b>${s.revenue} ${esc(s.currency)}</b>Revenus</div>` +
      (s.paidWithoutCode ? `<div class="stat warn"><b>${s.paidWithoutCode}</b>Payés sans code – ajoutez du stock !</div>` : '') +
      (s.unused < 10 ? `<div class="stat warn"><b>⚠</b>Stock bas</div>` : '');
    $('tCodes').innerHTML = '<tr><th>Code</th><th>Statut</th><th>Ajouté</th><th></th></tr>' + s.codes.map(c =>
      `<tr><td>${esc(c.code)}</td><td>${c.status === 'unused' ? 'Disponible' : 'Vendu'}</td><td>${fmt(c.addedAt)}</td>
       <td>${c.status === 'unused' ? `<button class="red" data-del="${esc(c.code)}">✕</button>` : ''}</td></tr>`).join('');
    $('tOrders').innerHTML = '<tr><th>Date</th><th>Réf</th><th>Tél</th><th>Mode</th><th>Statut</th><th>Code</th></tr>' + s.orders.map(o =>
      `<tr><td>${fmt(o.createdAt)}</td><td>${esc(o.ref)}</td><td>${esc(o.phone)}</td><td>${esc(o.method)}</td><td>${esc(o.status)}</td><td>${esc(o.code)}</td></tr>`).join('');
  } catch {}
}

$('loginBtn').onclick = async () => {
  try { await api('/api/admin/login', { method:'POST', body: JSON.stringify({ password: $('pw').value }) }); $('pw').value=''; load(); }
  catch (e) { $('loginMsg').textContent = e.message; }
};
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });
$('addBtn').onclick = async () => {
  try {
    const r = await api('/api/admin/codes', { method:'POST', body: JSON.stringify({ codes: $('codes').value }) });
    $('addMsg').textContent = `${r.added} ajouté(s), ${r.duplicates} doublon(s) ignoré(s).`;
    $('codes').value = ''; load();
  } catch (e) { $('addMsg').textContent = e.message; }
};
$('tCodes').onclick = async e => {
  const c = e.target.dataset.del;
  if (c && confirm('Supprimer le code ' + c + ' ?')) { await api('/api/admin/codes/' + encodeURIComponent(c), { method:'DELETE' }); load(); }
};
$('exportBtn').onclick = () => location.href = '/api/admin/export';
$('logoutBtn').onclick = async () => { await api('/api/admin/logout', { method:'POST' }); location.reload(); };
load(); setInterval(() => { if (!$('panel').classList.contains('hide')) load(); }, 30000);
</script>
</body>
</html>
